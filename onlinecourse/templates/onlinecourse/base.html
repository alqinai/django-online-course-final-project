<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}OnlineCourse{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb;color:#17233d}.hero{background:linear-gradient(120deg,#172654,#3d55aa);color:white;border-radius:1.25rem}.card{border:0;border-radius:1rem;box-shadow:0 10px 26px rgba(19,35,78,.06)}.badge-pass{background:#d9f4e9;color:#12684a}</style></head>
<body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'onlinecourse:course_list' %}">🎓 OnlineCourse</a><div>{% if user.is_authenticated %}<span class="me-3">{{ user.username }}</span><a class="btn btn-outline-secondary btn-sm" href="/admin/">Admin</a>{% else %}<a class="btn btn-primary btn-sm" href="/admin/login/">Log in</a>{% endif %}</div></div></nav>
<main class="container py-5">{% block content %}{% endblock %}</main></body></html>
